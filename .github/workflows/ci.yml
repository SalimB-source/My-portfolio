name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Server build (Vercel-style)
        run: npm run build
      - name: Static export (GitHub Pages)
        run: npm run build:pages
        env:
          BASE_PATH: /My-portfolio
